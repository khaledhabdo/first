name: CI

on:
  push:
    branches:
      - main
      - phase1-data-validation
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Offline Unit & Security Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify bytecode compilation
        run: python3 -m compileall -q src tests

      - name: Validate pyproject.toml
        run: |
          python3 -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); assert d['project']['name'] == 'manualops-radar'; assert d['project']['dependencies'] == []"

      - name: Run offline unit and security test suite
        run: python3 -m unittest discover -s tests -v
